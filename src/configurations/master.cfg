# Configuration for ´master_script.py´ script

[create_input]
# Number of clips from "rating_clips" to be judged in one session, the trapping questions and gold clips will add up to this number
number_of_clips_per_session:10
number_of_trapping_per_session:1
number_of_gold_clips_per_session:1
#"condition_pattern" specifies a regex to extract the condition name from the file name.
# example: Assuming "D501_C03_M2_S02.wav" is a file name,and "03" is the condition name. The pattern will be
# ".*_c(?P<condition_num>\d{1,2})_.*.wav" , you should also use condition_keys
# uncomment both when condition level aggregation is needed
#
#condition_pattern:.*_c(?P<condition_num>\d{1,2})_.*.wav
#condition_keys = condition_num
#
# How to select clips assessed in a same HIT:random, balanced_block
# for the "balanced_block" design, "condition_pattern" should be specified.  "number_of_clips_per_session" should be
# equal to the number of conditions.
clip_packing_strategy: random
# The key(s) to be used for creating the blocks should be specified here.Up to two keys. A comma separated list.
#For multiple keys, all values of the first key should appear in one block.
#block_keys: condition_num


[hit_app_html]
# optional, if not set a random string will be used.
#cookie_name:itu_p808_sup23_exp3
# optional, if not set a random string will be used.
#qual_cookie_name:ACR_LISTENER_01_14_2020
allowed_max_hit_in_project:60
# can be "NB-WB", "SWB", "FB"
bw_min: "NB-WB"
bw_max: "FB"
hit_base_payment:0.5
quantity_hits_more_than: 30
quantity_bonus: 0.1
quality_top_percentage: 20
quality_bonus: 0.15
contact_email:ic3ai@outlook.com
# show the in-HIT qualification section (true/false). Set to false when the
# qualification is run as a separate study (e.g. a Prolific screener). Default: true.
show_qualification: true
# Optional study-level screen-out completion codes. These are entered by the
# participant on the crowdsourcing platform (e.g. Prolific) to be paid for their
# screening effort when they fail the in-HIT screening:
#   - screenout_code_qualification: shown when the qualification (bandwidth/hearing)
#     check fails on the final attempt.
#   - screenout_code_setup: shown when the setup (environment/math) check fails after
#     the allowed number of attempts.
# If a code is left unset, the master script keeps the ${screenout_code_qualification}
# / ${screenout_code_setup} placeholder so the HIT App Server can fill it at run time
# (a warning is printed at generation time). When neither the config nor the server
# provides a code, the participant is asked to return the task instead of being paid.
#screenout_code_qualification: XXXXXXXX
#screenout_code_setup: XXXXXXXX
# In-HIT (online) evaluation of the qualification and setup sections (both default true).
# When set to false, that section's correct answers are NOT embedded in the generated
# HTML, its client-side check and "Check answers" button are hidden, and all grading for
# that section is performed offline by result_parser.py from the submitted answers.
#run_online_eval_qualification: true
#run_online_eval_setup: true
# Objective listening-device check. A short acoustic echo test runs in the browser:
# a probe tone is played through the active playback device while the microphone is
# recorded (with browser echo cancellation/AGC/noise-suppression disabled). Strong
# microphone-to-playback coupling implies a loudspeaker; weak coupling implies a headset.
# The check is MANDATORY: the participant cannot continue until the detected device
# matches the required device (and their self-report). No audio is stored or transmitted.
#   - required_playback_device: the device the task requires, "headset" or "loudspeaker"
#     (default: headset).
#   - device_check_threshold_db: coupling (in dB) at/above which a loudspeaker is
#     inferred. Tune per your audio setup by browser testing (default: 6).
#required_playback_device: headset
#device_check_threshold_db: 6

